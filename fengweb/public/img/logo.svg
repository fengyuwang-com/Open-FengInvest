<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FengInvest logo — 雪山">
  <!-- 现代主义极简雪山：三个几何形，宪法色板 -->
  <rect width="64" height="64" rx="14" fill="#F6F7F9"/>
  <!-- 次峰（冷静蓝，远景） -->
  <polygon points="34,52 47,30 60,52" fill="#3D5A80"/>
  <!-- 主峰（石墨，近景） -->
  <polygon points="4,52 28,14 52,52" fill="#1E293B"/>
  <!-- 雪盖（白，锯齿底缘） -->
  <polygon points="20,27.5 28,14 36,27.5 32.5,24.5 28,29 23.5,24.5" fill="#FFFFFF"/>
  <!-- 地平线（一笔收底） -->
  <rect x="4" y="50" width="56" height="2" fill="#1E293B"/>
</svg>
